<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ユーザー編集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <h1 class="mb-4">ユーザー編集</h1>

    <form th:action="@{/users/update/{id}(id=${userId})}"
          th:object="${userForm}"
          method="post">

        <div class="mb-3">
            <label class="form-label">名前</label>
            <input type="text" th:field="*{name}" class="form-control">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">年齢</label>
            <input type="number" th:field="*{age}" class="form-control">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('age')}"
                 th:errors="*{age}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">住所</label>
            <input type="text" th:field="*{address}" maxlength="255" class="form-control">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('address')}"
                 th:errors="*{address}"></div>
        </div>

        <button type="submit" class="btn btn-success">
            更新
        </button>

        <a th:href="@{/users-page}" class="btn btn-secondary ms-2">
            一覧へ戻る
        </a>

    </form>

</div>
</body>
</html>
