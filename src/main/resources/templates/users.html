<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            padding: 30px 0;
        }
        
        .container {
            max-width: 1000px;
        }
        
        .header-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        
        .header-section h1 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-register {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border: none;
            padding: 10px 25px;
            font-weight: 600;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
            color: white;
        }
        
        .table-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        
        .table {
            margin-bottom: 0;
        }
        
        .table thead {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
        }
        
        .table thead th {
            font-weight: 600;
            border: none;
            padding: 18px 15px;
            text-align: center;
        }
        
        .table tbody td {
            padding: 18px 15px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }
        
        .table tbody tr:hover {
            background-color: #f9f9f9;
        }
        
        .table tbody tr:last-child td {
            border-bottom: none;
        }
        
        .user-id {
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .user-name {
            color: #333;
            font-weight: 500;
        }
        
        .action-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        
        .btn-edit {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 14px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
            transition: background-color 0.2s, transform 0.2s;
        }
        
        .btn-edit:hover {
            background-color: #218838;
            transform: translateY(-2px);
            text-decoration: none;
            color: white;
        }
        
        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 14px;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s, transform 0.2s;
            cursor: pointer;
        }
        
        .btn-delete:hover {
            background-color: #c82333;
            transform: translateY(-2px);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 30px;
            color: #999;
        }
        
        .empty-state i {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ddd;
        }
        
        .empty-state p {
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        .badge-age {
            background-color: #e7f3ff;
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-section">
        <h1>
            <i class="bi bi-people-fill"></i>
            ユーザー一覧
        </h1>
        <a th:href="@{/user-form}" class="btn btn-register">
            <i class="bi bi-plus-circle"></i>
            新規登録
        </a>
    </div>

    <div class="table-container" th:if="${not #lists.isEmpty(users)}">
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>名前</th>
                    <th>年齢</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td class="user-id" th:text="${user.id}"></td>
                    <td class="user-name" th:text="${user.name}"></td>
                    <td style="text-align: center;">
                        <span class="badge-age" th:text="${user.age} + '歳'"></span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn-edit">
                                <i class="bi bi-pencil-square"></i>
                                編集
                            </a>
                            <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn-delete" onclick="return confirm('このユーザーを削除しますか？');">
                                    <i class="bi bi-trash"></i>
                                    削除
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="table-container empty-state" th:if="${#lists.isEmpty(users)}">
        <i class="bi bi-inbox"></i>
        <p>ユーザーがまだ登録されていません</p>
        <a th:href="@{/user-form}" class="btn btn-register">
            <i class="bi bi-plus-circle"></i>
            最初のユーザーを登録
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
