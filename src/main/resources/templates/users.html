<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary-color:#667eea; --secondary-color:#764ba2; }
        body { background:linear-gradient(135deg,var(--primary-color) 0%,var(--secondary-color) 100%); min-height:100vh; padding:30px 0; }
        .container { max-width:1000px; }
        .header-section { background:white; border-radius:12px; padding:30px; margin-bottom:30px; box-shadow:0 8px 24px rgba(0,0,0,.12); }
        .header-section h1 { color:var(--primary-color); font-weight:700; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
        .btn-register { background:linear-gradient(135deg,var(--primary-color) 0%,var(--secondary-color) 100%); border:none; padding:10px 25px; font-weight:600; border-radius:8px; }
        .table-container { background:white; border-radius:12px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.12); }
        .table thead { background:linear-gradient(135deg,var(--primary-color) 0%,var(--secondary-color) 100%); color:white; }
        .table thead th { text-align:center; }
        .action-buttons { display:flex; gap:8px; justify-content:center; }
        .badge-age { background-color:#e7f3ff; color:var(--primary-color); padding:4px 10px; border-radius:20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header-section">
        <h1><i class="bi bi-people-fill"></i>ユーザー一覧</h1>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <form th:action="@{/users-page}" method="get" class="d-flex gap-2">
                <input type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="名前で検索"
                       th:value="${param.keyword}">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-search"></i> 検索
                </button>
            </form>

            <a th:href="@{/user-form}" class="btn btn-register">
                <i class="bi bi-plus-circle"></i>
                新規登録
            </a>
        </div>
    </div>

    <div class="table-container" th:if="${not #lists.isEmpty(users)}">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>名前</th>
                <th>年齢</th>
                <th>住所</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.name}"></td>
                <td style="text-align:center"><span class="badge-age" th:text="${user.age} + '歳'"></span></td>
                <td th:text="${user.address}"></td>
                <td>
                    <div class="action-buttons">
                        <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-success btn-sm">編集</a>
                        <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post">
                            <button type="submit" class="btn btn-danger btn-sm">削除</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
