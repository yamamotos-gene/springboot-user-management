<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>
</head>
<body>

<h1>ユーザー登録</h1>

<form th:action="@{/users-page/add}"
      th:object="${userForm}"
      method="post">

    <div style="color:red"
         th:if="${#fields.hasGlobalErrors()}"
         th:each="error : ${#fields.globalErrors()}"
         th:text="${error}">
    </div>

    <div>
        名前:
        <input type="text" th:field="*{name}">
    </div>

    <div style="color:red"
         th:if="${#fields.hasErrors('name')}"
         th:errors="*{name}">
    </div>

    <br>

    <div>
        生年月日（必須）:
        <input type="date" th:field="*{birthday}" required>
    </div>

    <br>

    <div>
        住所:
        <input type="text" th:field="*{address}" maxlength="255">
    </div>

    <div style="color:red"
         th:if="${#fields.hasErrors('address')}"
         th:errors="*{address}">
    </div>

    <br>

    <button type="submit">
        登録
    </button>

</form>

<br><br>

<a th:href="@{/users-page}">
    一覧へ戻る
</a>

</body>
</html>
